project:
  type: website
  output-dir: _site
  resources:
    - "diagrams/*.html"
    - "visual-language/tokens.css"
    - "visual-language/template.html"

website:
  title: "Buddy CPaaS — Design Corpus"
  search:
    location: sidebar
    type: textbox
  page-navigation: true
  sidebar:
    style: docked
    collapse-level: 1
    contents:
      - text: "Start here"
        href: index.qmd
      - section: "Canon — the 17 tables"
        contents:
          - text: "System thesis & laws"
            href: canon/README.md
          - canon/01-identity.md
          - canon/02-record.md
          - canon/03-permission.md
          - canon/04-connectivity.md
          - canon/05-audiences.md
          - canon/06-outreach.md
          - canon/07-wiring.md
      - section: "Decisions (ADR 0001–0021)"
        contents:
          - text: "Index"
            href: decisions/README.md
          - decisions/*.md
      - section: "Design docs"
        contents:
          - design/app-crm-architecture.md
          - design/entry-points-and-the-event-spine.md
          - design/ingest-doors.md
          - design/event-catalog.md
          - design/worker-runtime.md
          - design/inbox-and-conversations.md
          - design/gate-mechanics.md
          - design/console-ui.md
          - design/task-map.md
          - design/execution-ledger.md
      - section: "Module build guides"
        contents:
          - text: "Index"
            href: modules/README.md
          - modules/00-module-rules.md
          - modules/01-record.md
          - modules/02-identity.md
          - modules/03-permission.md
          - modules/04-connectivity.md
          - modules/05-outreach.md
          - modules/06-conversations-inbox.md
      - section: "Diagrams"
        contents:
          - diagrams/d00-master.qmd
          - diagrams/d01-event-spine.qmd
          - diagrams/d02-identity.qmd
          - diagrams/d03-permission.qmd
          - diagrams/d04-connectivity.qmd
          - diagrams/d05-outreach.qmd
          - diagrams/d06-conversations-inbox.qmd
          - diagrams/d07-event-worker-pass.qmd
          - diagrams/d08-cod-confirmation-flow.qmd
      - text: "Visual language"
        href: visual-language/README.md

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: true
    toc-depth: 3
    link-external-newwindow: true
